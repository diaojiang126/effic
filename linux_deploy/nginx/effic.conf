# /etc/nginx/sites-available/effic
# 启用: ln -s /etc/nginx/sites-available/effic /etc/nginx/sites-enabled/effic

upstream effic_app {
    server 127.0.0.1:5050 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   # 生产环境改为实际域名或IP

    client_max_body_size 16M;

    # 静态资源直连，绕开 Flask
    location /static/ {
        alias /opt/effic/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 快递单子系统静态资源
    location /express/static/ {
        alias /opt/effic/kdd/static/;
        expires 7d;
    }

    # 上传文件（如需直接访问）
    location /uploads/ {
        alias /opt/effic/static/uploads/;
        expires 1d;
    }

    location / {
        proxy_pass http://effic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
