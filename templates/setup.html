{% extends "base.html" %}

{% block title %}数据库设置 - 设备库存管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="fas fa-database text-primary"></i> 数据库设置
    </h1>
</div>

<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="fas fa-cog"></i> 一键数据库设置
                </h5>
            </div>
            <div class="card-body">
                <p class="mb-4">
                    点击下方按钮，系统将自动创建数据库表并初始化默认数据。
                    此功能适用于新设备部署时使用。
                </p>
                
                <div class="alert alert-warning" role="alert">
                    <i class="fas fa-exclamation-triangle"></i> 
                    <strong>注意：</strong> 此操作将创建数据库表和初始化数据，
                    如果数据库已存在，将不会影响现有数据。
                </div>
                
                <div class="text-center">
                    <button id="setupBtn" class="btn btn-primary btn-lg">
                        <i class="fas fa-play-circle"></i> 开始设置
                    </button>
                    
                    <div id="resultDiv" class="mt-4" style="display: none;">
                        <div id="resultAlert" class="alert" role="alert">
                            <!-- 结果信息将显示在这里 -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="text-muted text-center">
                    系统会自动检测并创建数据库（如果不存在）
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('setupBtn').addEventListener('click', function() {
    const btn = this;
    const resultDiv = document.getElementById('resultDiv');
    const resultAlert = document.getElementById('resultAlert');
    
    // 禁用按钮，防止重复点击
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 设置中...';
    
    // 隐藏结果信息
    resultDiv.style.display = 'none';
    
    // 发送请求到API
    fetch('/api/setup', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        // 更新结果信息
        resultAlert.innerHTML = '';
        
        if (data.success) {
            resultAlert.className = 'alert alert-success';
            resultAlert.innerHTML = `
                <i class="fas fa-check-circle"></i> 
                <strong>成功！</strong> ${data.message}<br>
                <a href="/" class="btn btn-sm btn-outline-success mt-2">
                    <i class="fas fa-home"></i> 回到首页
                </a>
            `;
        } else {
            resultAlert.className = 'alert alert-danger';
            resultAlert.innerHTML = `
                <i class="fas fa-times-circle"></i> 
                <strong>失败！</strong> ${data.message}
            `;
        }
        
        resultDiv.style.display = 'block';
        
        // 恢复按钮状态
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-play-circle"></i> 开始设置';
    })
    .catch(error => {
        console.error('Error:', error);
        
        // 更新结果信息
        resultAlert.className = 'alert alert-danger';
        resultAlert.innerHTML = `
            <i class="fas fa-times-circle"></i> 
            <strong>失败！</strong> 设置过程中发生错误，请检查控制台日志。
        `;
        
        resultDiv.style.display = 'block';
        
        // 恢复按钮状态
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-play-circle"></i> 开始设置';
    });
});
</script>
{% endblock %}
